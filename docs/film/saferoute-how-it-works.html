<title>SafeRoute는 어떻게 오프라인에서 1 ms 만에 대피 방향을 알려 주나</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#0c0f16; --stage:#0e1118; --panel:#161b26; --ink:#eef2f8; --muted:#8c99ab; --line:#2a3242;
  --blue:#5b9cff; --blue2:#2f6fe0; --yellow:#f6c344; --green:#43d6a0; --red:#f27a6e; --purple:#b79cff; --data:#43d6a0;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:22px 48px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;flex-direction:column;gap:4px}
h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.chapter{position:absolute;top:14px;left:16px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:rgba(12,15,22,.55);border:1px solid var(--line);border-radius:999px;padding:5px 12px;backdrop-filter:blur(4px)}

.chdot{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.cap{min-height:4.4em;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:16px;line-height:1.55;color:var(--ink)}
.cap span{max-width:70ch}
.cap .k{color:var(--yellow);font-weight:600}
.cap .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.9em;color:var(--blue)}
.bar{display:flex;align-items:center;gap:12px}
.scrub{flex:1;accent-color:var(--blue);height:4px}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--blue2);border-color:var(--blue2);font-weight:600;min-width:92px}
button:hover{border-color:var(--blue)}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.time{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:92px;text-align:right}
select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer}
.chapters{display:flex;flex-wrap:wrap;gap:6px}
.chapters button{font-size:12px;padding:5px 10px;color:var(--muted);border-radius:8px}
.chapters button.active{color:var(--ink);border-color:var(--blue);background:rgba(91,156,255,.12)}
.foot{color:var(--muted);font-size:12.5px;margin:0;text-align:center}
@media (max-width:560px){
  .cap{font-size:14px;min-height:5em}
  .bar{flex-wrap:wrap}
  .time{min-width:0}
}

<div class="wrap">
  <div class="head">
    <h1>SafeRoute는 어떻게 오프라인에서 1 ms 만에 대피 방향을 알려 주나</h1>
    <p class="sub">평소에 미리 계산하고, 위급할 때는 따라가기만 한다</p>
  </div>

    <canvas id="cv" aria-label="애니메이션 영상 화면"></canvas>

  </div>

  <div class="cap" aria-live="polite"><span id="cap"></span></div>

  <div class="bar">

<script>
(function(){
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const SANS = '"IBM Plex Sans KR", system-ui, sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, monospace';
let w = 0, h = 0, dpr = 1;
const reduce = matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const C = {
  bg:'#0e1118', ink:'#eef2f8', muted:'#8c99ab', faint:'#5a6678', line:'#2a3242', panel:'#1a2130',
  blue:'#5b9cff', blueDim:'#2f4a7a', yellow:'#f6c344', green:'#43d6a0', red:'#f27a6e', purple:'#b79cff'
};

/* ---------- math / helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ap=(lt,s,d)=>clamp((lt-s)/d,0,1);                 // linear 0..1
const es=p=>p*p*(3-2*p);                                 // smoothstep
const eo=p=>1-(1-p)*(1-p);                                // easeOut
const E=(lt,s,d)=>es(ap(lt,s,d));                         // eased reveal
function A(a){ctx.globalAlpha=a;}

function RR(x,y,bw,bh,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,bw,bh,r);else{ctx.moveTo(x+r,y);ctx.arcTo(x+bw,y,x+bw,y+bh,r);ctx.arcTo(x+bw,y+bh,x,y+bh,r);ctx.arcTo(x,y+bh,x,y,r);ctx.arcTo(x,y,x+bw,y,r);ctx.closePath();}}
function box(x,y,bw,bh,r,fill,stroke,lw){RR(x,y,bw,bh,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1.4;ctx.stroke();}}
function T(s,x,y,size,color,align,weight,font){ctx.fillStyle=color;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.font=(weight||500)+' '+size+'px '+(font||SANS);ctx.fillText(s,x,y);ctx.textAlign='left';}
function TM(s,x,y,size,color,align,weight){T(s,x,y,size,color,align,weight||600,MONO);}
function seg(x1,y1,x2,y2,color,lw,dash){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=lw||1.6;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
function bez(x1,y1,x2,y2,color,lw,dash){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=lw||1.6;if(dash)ctx.setLineDash(dash);const mx=(x1+x2)/2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.bezierCurveTo(mx,y1,mx,y2,x2,y2);ctx.stroke();ctx.restore();}
function arrow(x1,y1,x2,y2,color,lw){seg(x1,y1,x2,y2,color,lw);const a=Math.atan2(y2-y1,x2-x1),s=Math.max(6,(lw||2)*3);ctx.save();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-s*Math.cos(a-.4),y2-s*Math.sin(a-.4));ctx.lineTo(x2-s*Math.cos(a+.4),y2-s*Math.sin(a+.4));ctx.closePath();ctx.fill();ctx.restore();}
function dot(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();}}
function glow(x,y,r,color,a){ctx.save();const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a==null?.5:a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore();}
function token(x,y,r,fill,label,tcol){dot(x,y,r,fill);if(label!=null)TM(label,x,y+.5,r*.95,tcol||'#0c0f16','center',700);}
// chip: labeled pill
function chip(x,y,bw,bh,fill,label,tcol,size){box(x,y,bw,bh,bh/2,fill);TM(label,x+bw/2,y+bh/2+.5,size||bh*.5,tcol||'#0c0f16','center',700);}
function title(s,lt,color){A(E(lt,.2,.9));T(s,w/2,h*.085,Math.round(h*.045),color||C.muted,'center',600);A(1);}


/* ---------- 장면 공통 헬퍼 ---------- */
function stepHud(lt, steps){
  let cur=steps[0]; for(const s of steps){ if(lt>=s[0]) cur=s; }
  const fs=Math.round(h*.028);
  ctx.font='700 '+fs+'px '+SANS;
  const tw=ctx.measureText(cur[1]).width+h*.08;
  A(.4+.6*E(lt-cur[0],0,.5));
  box(w/2-tw/2,h*.045,tw,h*.06,h*.03,'rgba(91,156,255,.14)',C.blue,1.2);
  T(cur[1],w/2,h*.075,fs,C.ink,'center',700);
  if(cur[2]) TM(cur[2],w/2,h*.148,Math.round(h*.025),C.yellow,'center',600);
  A(1);
}
function spaces(divY,lt){
  A(E(lt,.1,.8));
  seg(0,divY,w,divY,C.line,1.2,[6,6]);
  T('User space',w*.985,divY-h*.022,Math.round(h*.02),C.faint,'right',600);
  T('Kernel space',w*.985,divY+h*.024,Math.round(h*.02),C.faint,'right',600);
  A(1);
}
function bezPt(x1,y1,x2,y2,t){const mx=(x1+x2)/2,u=1-t;return [u*u*u*x1+3*u*u*t*mx+3*u*t*t*mx+t*t*t*x2, u*u*u*y1+3*u*u*t*y1+3*u*t*t*y2+t*t*t*y2];}
function mv(a,b,p){return [lerp(a[0],b[0],p),lerp(a[1],b[1],p)];}


/* ================= SCENES ================= */
const PALETTE=[C.blue,C.red,C.yellow,C.green,C.purple,'#4fd1c5','#ff9f5a'];
const scenes = [];
// S(id, '번호 · 챕터명', 길이(초), draw(lt), 자막[{t0,t1,text}], 챕터 점 색(선택))
function S(name,label,dur,draw,caps,color){scenes.push({name,label,dur,draw,caps,color});}

/*@film
title: SafeRoute는 어떻게 오프라인에서 1 ms 만에 대피 방향을 알려 주나
subtitle: 평소에 미리 계산하고, 위급할 때는 따라가기만 한다
artifact:
*/

/* ---------- 공용: 작은 보행망 (씬 3·4·6) ---------- */
const QUAKE = '#e5534b', FLOOD = '#4c8dff';
const GC = 9, GR = 5;
function gx(i){ return w*(.14 + i*.09); }
function gy(j){ return h*(.30 + j*.12); }
// 4-이웃 격자. 일부 길은 없음, 일부는 지하 통로(홍수 때 ×20).
const MISSING = new Set(['2,1-3,1','5,3-6,3','3,3-3,4','6,0-7,0','1,2-1,3']);
const UNDER = new Set(['4,2-5,2']);
const EDGES = [];
for(let j=0;j<GR;j++) for(let i=0;i<GC;i++){
  if(i<GC-1){ const k=i+','+j+'-'+(i+1)+','+j; if(!MISSING.has(k)) EDGES.push([i,j,i+1,j,UNDER.has(k)]); }
  if(j<GR-1){ const k=i+','+j+'-'+i+','+(j+1); if(!MISSING.has(k)) EDGES.push([i,j,i,j+1,UNDER.has(k)]); }
}
const NID = (i,j)=> j*GC+i;
function tree(sources, underPenalty){
  const n=GC*GR, dist=new Array(n).fill(1e9), next=new Array(n).fill(-1), shel=new Array(n).fill(-1);
  const adj=Array.from({length:n},()=>[]);
  for(const [a,b,c,d,u] of EDGES){ const wgt=u?underPenalty:1; adj[NID(a,b)].push([NID(c,d),wgt,u]); adj[NID(c,d)].push([NID(a,b),wgt,u]); }
  const q=[];
  sources.forEach((s,k)=>{ const id=NID(s[0],s[1]); dist[id]=0; next[id]=id; shel[id]=k; q.push(id); });
  while(q.length){ q.sort((x,y)=>dist[x]-dist[y]); const u=q.shift();
    for(const [v,wgt] of adj[u]){ if(dist[u]+wgt<dist[v]){ dist[v]=dist[u]+wgt; next[v]=u; shel[v]=shel[u]; q.push(v);} } }
  return {dist,next,shel};
}
const QS = [[0,0],[8,4]];            // 지진: 운동장·공원
const FS = [[7,0],[1,4]];            // 홍수: 지하 아닌 임시주거시설
const TQ = tree(QS, 1), TF = tree(FS, 20), TFraw = tree(FS, 1);
const ME = [4,2];
function drawGrid(alpha, underColor){
  A(alpha);
  for(const [a,b,c,d,u] of EDGES){
    if(u) seg(gx(a),gy(b),gx(c),gy(d),underColor||C.red,2.2,[6,5]);
    else seg(gx(a),gy(b),gx(c),gy(d),C.line,2);
  }
  A(1);
}
function shelters(list,col,alpha,label){
  A(alpha);
  list.forEach(s=>{ glow(gx(s[0]),gy(s[1]),h*.05,col,.35); box(gx(s[0])-h*.022,gy(s[1])-h*.022,h*.044,h*.044,6,col);
    if(label) T(label,gx(s[0]),gy(s[1])+h*.045,Math.round(h*.017),col,'center',600); });
  A(1);
}
function pathFrom(tr,start){ const out=[start]; let c=start; for(let k=0;k<40&&tr.next[c]!==c&&tr.next[c]>=0;k++){ c=tr.next[c]; out.push(c);} return out; }
function nxy(id){ return [gx(id%GC), gy(Math.floor(id/GC))]; }
function legend(items){
  const fs=Math.round(h*.018); let x=w*.06;
  items.forEach(([c,l])=>{ dot(x,h*.945,h*.009,c); T(l,x+h*.018,h*.945,fs,C.muted,'left',500); ctx.font='500 '+fs+'px '+SANS; x+=ctx.measureText(l).width+h*.06; });
}

/* ---------- 1 · 문제 ---------- */
S('problem','1 · 문제',25,(lt)=>{
  title('경보가 울린 순간, 어디로 가야 하나', lt, C.muted);
  const px=w*.5, py=h*.55;
  // 폰
  A(E(lt,.3,.8)); box(px-w*.09,h*.22,w*.18,h*.66,24,C.panel,C.line,1.6);
  A(.6+.4*Math.abs(Math.sin(lt*4))*(lt<6?1:0)+(lt>=6?.4:0));
  chip(px-w*.07,h*.26,w*.14,h*.05,C.red,'재난 경보','#fff',Math.round(h*.022)); A(1);
  dot(px,py,h*.016,C.ink); glow(px,py,h*.05,'rgba(255,255,255,.3)',.5);
  // 두 방향
  const qa=E(lt,5,1.2), fa=E(lt,7,1.2);
  if(qa>0){ A(qa); arrow(px,py,px+(-w*.07)*qa,py-h*.14*qa,QUAKE,5); T('지진 → 넓은 공터',px-w*.08,py-h*.18,Math.round(h*.02),QUAKE,'center',700); A(1); }
  if(fa>0){ A(fa); arrow(px,py,px+w*.07*fa,py+h*.12*fa,FLOOD,5); T('홍수 → 높은 곳, 지하 피하기',px+w*.06,py+h*.18,Math.round(h*.02),FLOOD,'center',700); A(1); }
  // 통신 끊김
  const sa=E(lt,11,.8);
  if(sa>0){ A(sa); const bx=px+w*.05, by=h*.31;
    for(let k=0;k<4;k++) box(bx+k*h*.012,by-k*h*.008,h*.008,h*.012+k*h*.008,2,lt>13?C.faint:C.ink);
    if(lt>13){ seg(bx-4,by-h*.03,bx+h*.05,by+h*.01,C.red,3); T('통신 끊김',bx+h*.02,by+h*.035,Math.round(h*.017),C.red,'center',700); } A(1); }
  // 수치
  const na=E(lt,17,1);
  if(na>0){ A(na); T('35.4%',w*.2,h*.5,Math.round(h*.075),C.ink,'center',800);
    T('서울 시민 중 지진과 홍수의',w*.2,h*.6,Math.round(h*.022),C.muted,'center',500);
    T('첫 이동 방향이 90° 넘게 다른 비율',w*.2,h*.64,Math.round(h*.022),C.muted,'center',500);
    TM('eval/seoul_divergence.py · WorldPop 2020',w*.2,h*.7,Math.round(h*.016),C.faint,'center',500); A(1); }
},[
  {t0:0,t1:5,text:'재난 경보가 울렸습니다. 지금 이 자리에서 <b>어디로</b> 걸어가야 할까요?'},
  {t0:5,t1:11,text:'정답은 재난마다 다릅니다. 지진은 <span class="k">건물에서 떨어진 넓은 공간</span>, 홍수는 <span class="k">높은 곳, 지하는 피하기</span>.'},
  {t0:11,t1:17,text:'그리고 큰 재난 때는 통신이 끊길 수 있습니다. 서버에 물어볼 수 없다는 뜻입니다.'},
  {t0:17,t1:25,text:'서울 시민의 <b>35.4%</b>는 지진과 홍수 때 처음 걸어야 할 방향이 90° 넘게 다릅니다. 같은 앱, 같은 자리라도 재난별 답이 필요합니다.'},
],C.red);

/* ---------- 2 · 규칙 테이블 ---------- */
S('rules','2 · 규칙 테이블',30,(lt)=>{
  stepHud(lt,[[0,'STEP 1 · 재난 → 목적지 규칙','pipeline/schema.py · HAZARD_RULES'],[14,'STEP 2 · LLM은 목적지를 정하지 않는다','suitable(shelter, hazard)']]);
  const tx=w*.08, tw=w*.84, ty=h*.24, rh=h*.11, fs=Math.round(h*.021);
  const cols=[0,.14,.44,.72];
  const rows=[
    ['재난','허용 목적지','경로 비용','행동 문구 (출처: 행정안전부)'],
    ['지진','옥외대피장소 (운동장·공원)','—','흔들림이 멈추면 건물 밖 넓은 곳으로'],
    ['홍수','임시주거시설 · 지하 제외','지하 ×20 · 침수흔적 ×3','높은 곳으로, 지하는 피하기'],
    ['(일본)','지정긴급피난장소 재난 플래그','—','쓰나미·산사태·화재 행 추가'],
  ];
  rows.forEach((r,i)=>{ const a=E(lt,.4+i*1.4,.7); if(a<=0) return; A(a);
    const y=ty+i*rh; if(i>0) seg(tx,y,tx+tw,y,C.line,1);
    const col = i===1?QUAKE:i===2?FLOOD:i===0?C.muted:C.faint;
    r.forEach((c,k)=> T(c,tx+tw*cols[k]+8,y+rh/2,i===0?Math.round(fs*.9):fs,k===0?col:(i===0?C.muted:C.ink),'left',k===0||i===0?700:500));
    A(1); });
  if(lt>14){ const l=lt-14;
    const bx=w*.5, by=h*.78;
    A(E(l,0,.8)); box(bx-w*.32,by-h*.07,w*.64,h*.14,14,C.panel,C.line,1.4);
    token(bx-w*.25,by,h*.032,C.purple,'AI','#fff');
    T('LLM이 "여기로 가세요"를 만들어 내면?',bx-w*.2,by-h*.02,Math.round(h*.022),C.ink,'left',600);
    A(E(l,2,.6)); seg(bx-w*.27,by-h*.04,bx-w*.23,by+h*.04,C.red,4); seg(bx-w*.23,by-h*.04,bx-w*.27,by+h*.04,C.red,4);
    T('목적지는 규칙과 공식 데이터만 정합니다 → 지어낸 장소 0',bx-w*.2,by+h*.03,Math.round(h*.022),C.green,'left',700); A(1);

/* ================= ENGINE ================= */
let total=0; const offs=[];
scenes.forEach(s=>{offs.push(total); total+=s.dur;});
let t=0, playing=false, last=null, speed=1;

function fit(){
  const r=cv.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1);
  w=r.width; h=r.height;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function sceneAt(time){let i=scenes.length-1;for(let k=0;k<scenes.length;k++){if(time<offs[k]+scenes[k].dur){i=k;break;}}return i;}
function fmt(s){s=Math.max(0,s);const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}

function render(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,w,h);
  // faint vignette
  const vg=ctx.createRadialGradient(w/2,h*.45,h*.1,w/2,h*.45,h*.9);
  vg.addColorStop(0,'rgba(91,156,255,.04)'); vg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,w,h);
  const i=sceneAt(t), sc=scenes[i], lt=t-offs[i];
  ctx.globalAlpha=1;
  try{ sc.draw(lt); }catch(e){ ctx.globalAlpha=1; T('scene error: '+e.message,16,h-20,13,C.red,'left',600); if(!sc._err){sc._err=1;console.error('['+sc.name+'] lt='+lt.toFixed(2),e);} }
  ctx.globalAlpha=1;
  // HUD
  document.getElementById('chlabel').innerHTML='<b>'+sc.label.split(' · ')[0]+'</b> · '+(sc.label.split(' · ')[1]||sc.name);
  document.getElementById('chdot').style.background=sc.color||PALETTE[i%PALETTE.length];
  let cap=''; for(const c of sc.caps){ if(lt>=c.t0&&lt<c.t1){cap=c.text;break;} }
  document.getElementById('cap').innerHTML=cap;
  const scr=document.getElementById('scrub'); if(document.activeElement!==scr){scr.value=(t/total*100).toFixed(2);}
  document.getElementById('time').textContent=fmt(t)+' / '+fmt(total);
  document.querySelectorAll('.chapters button').forEach((b,bi)=>b.classList.toggle('active',bi===i));
}
function tick(ts){
  if(!playing){last=null;return;}
  if(last!=null){ t+=Math.min(.05,(ts-last)/1000)*speed; if(t>=total){t=total;playing=false;} }
  last=ts; render(); updatePlay();
  if(playing) requestAnimationFrame(tick);
}
function updatePlay(){document.getElementById('play').textContent = playing?'일시정지':(t>=total?'다시 재생':(t>0?'계속':'재생'));}
function play(){ if(t>=total) t=0; playing=true; last=null; updatePlay(); requestAnimationFrame(tick); }
function pause(){ playing=false; updatePlay(); }

// chapter buttons
const chRow=document.getElementById('chapters');
scenes.forEach((s,i)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=s.label.split(' · ')[0]+'. '+(s.label.split(' · ')[1]||s.name); b.addEventListener('click',()=>{t=offs[i];render();updatePlay();}); chRow.appendChild(b); });

document.getElementById('play').addEventListener('click',()=>playing?pause():play());
document.getElementById('restart').addEventListener('click',()=>{pause();t=0;render();updatePlay();});
document.getElementById('scrub').addEventListener('input',e=>{t=(+e.target.value/100)*total;render();updatePlay();});
document.getElementById('speed').addEventListener('change',e=>{speed=+e.target.value;});
window.addEventListener('resize',()=>{fit();render();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());

// 딥링크: #s3 → 3번째 씬부터
const hm=/^#s(\d+)$/.exec(location.hash||''); if(hm){const k=Math.min(scenes.length,Math.max(1,+hm[1]))-1; t=offs[k];}
window.__film={scenes,offs,get total(){return total;}};
fit(); render(); updatePlay();
if(!reduce&&!hm) play();
})();
